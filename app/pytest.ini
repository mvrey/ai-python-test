[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Third-party deprecations from the pinned fastapi/starlette/httpx combination, not our code.
filterwarnings =
    ignore::DeprecationWarning:starlette.testclient
    ignore::DeprecationWarning:httpx._client
